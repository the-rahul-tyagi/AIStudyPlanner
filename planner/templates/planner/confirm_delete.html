{% extends 'base.html' %}
{% block title %}Confirm Delete | AI Study Planner{% endblock %}
{% block page_title %}Confirm Deletion{% endblock %}

{% block content %}
<div class="card p-4" style="max-width: 480px;">
    <h5 class="fw-bold text-danger mb-2">Delete "{{ object_name }}"?</h5>
    <p class="text-muted small mb-4">This action cannot be undone and will remove any linked records.</p>
    <form method="post">
        {% csrf_token %}
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-danger">Yes, Delete</button>
            <a href="{% url cancel_url %}" class="btn btn-outline-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
